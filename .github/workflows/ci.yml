name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npx expo-doctor
      # Proves Metro (not just Jest's separate moduleNameMapper) still
      # resolves the "@/" path alias declared in metro.config.js/tsconfig.json.
      - run: npx expo export --platform ios
